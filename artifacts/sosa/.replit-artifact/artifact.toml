kind = "web"
previewPath = "/"
title = "Sosa Socials"
version = "1.0.0"
id = "artifacts/sosa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21711

[services.development]
run = "pnpm --filter @workspace/sosa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sosa", "run", "build" ]
publicDir = "artifacts/sosa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21711"
BASE_PATH = "/"
