<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: -apple-system, sans-serif; padding: 28px; }
  h1 { color: #fff; font-size: 20px; font-weight: 900; margin-bottom: 4px; }
  p  { color: #555; font-size: 12px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .card {
    background: #0f0f0f;
    border: 1px solid #1f1f1f;
    border-radius: 14px;
    padding: 12px 8px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: border-color .2s;
  }
  .badge-wrap {
    width: 52px; height: 52px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .name { color: #e5e7eb; font-size: 10px; font-weight: 700; text-align: center; line-height: 1.3; }
  .price { color: #6b7280; font-size: 9px; text-align: center; }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.8;transform:scale(1.06)} }
  @keyframes spin  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes flicker { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.04) scaleX(.97)} }

  .section-label {
    color: #4b5563; font-size: 10px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; margin: 16px 0 8px;
  }
</style>
</head>

function renderGroup(id) {
  const el = document.getElementById(id);
  BADGES[id].forEach(b => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.borderColor = b.color + '33';
    card.innerHTML = `
      <div class="badge-wrap" style="background:${b.color}18;border:1px solid ${b.color}40">
        ${b.svg}
      </div>
      <div class="name">${b.name}</div>
      <div class="price">${prices[b.name]||''}</div>
    `;
    el.appendChild(card);
  });
}

['classic','heraldic','elemental','celestial','dark','rest'].forEach(renderGroup);
